<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkmarx One — Onboarding Checklist</title>
<style>
  :root{
    --violet:#6B34FD;
    --magenta:#A822BF;
    --midnight:#140920;
    --orange:#F25929;
    --white:#FCF9FE;

    --bg: var(--midnight);
    --panel: #1C1030;
    --panel-2: #24173C;
    --border: #3A2A55;
    --text: var(--white);
    --text-dim: #B9AEC9;
    --text-dimmer: #7F7096;
    --accent: var(--violet);
    --accent-2: var(--magenta);
    --done: #35C48A;
    --unsupported: #E0383E;
    --cs: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg: #F3EFFB;
      --panel: #FFFFFF;
      --panel-2: #F7F3FF;
      --border: #E1D6F5;
      --text: var(--midnight);
      --text-dim: #4A3D63;
      --text-dimmer: #8A7BA3;
      --cs: light;
    }
  }
  :root[data-theme="light"]{
    --bg: #F3EFFB;
    --panel: #FFFFFF;
    --panel-2: #F7F3FF;
    --border: #E1D6F5;
    --text: var(--midnight);
    --text-dim: #4A3D63;
    --text-dimmer: #8A7BA3;
    --cs: light;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:32px 20px 80px;
  }

  /* header */
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px);
    z-index:20;
    background:linear-gradient(180deg, var(--bg) 78%, transparent);
    padding:14px 0 10px;
    margin-bottom:8px;
  }
  .titlebar{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .titlebar h1{
    font-size:1.35rem;
    letter-spacing:-0.01em;
    margin:0;
    font-weight:700;
  }
  .titlebar h1 span{color:var(--accent-2);}
  .theme-toggle{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:20px; padding:5px 12px; font-size:0.75rem; cursor:pointer;
  }
  .theme-toggle:hover{border-color:var(--accent);}

  .subrow{
    display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap;
  }
  .field{
    flex:1 1 220px;
    min-width:180px;
  }
  label.tiny{
    display:block; font-size:0.7rem; color:var(--text-dimmer);
    margin-bottom:4px;
  }
  input[type=text]{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:8px;
    font-size:0.9rem;
  }
  input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px;}

  select{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 10px;
    border-radius:8px;
    font-size:0.85rem;
    max-width:220px;
  }

  .cust-list-panel{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    left:0; right:0;
    z-index:30;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 12px 28px rgba(0,0,0,.35);
    max-height:280px;
    overflow-y:auto;
    padding:4px;
  }
  .cust-list-panel.open{ display:block; }
  .cust-list-group-label{
    font-size:0.63rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-dimmer); padding:7px 8px 3px;
  }
  .cust-list-row{
    display:flex; align-items:center; gap:6px;
    padding:7px 8px; border-radius:7px; cursor:pointer;
  }
  .cust-list-row:hover{ background:var(--panel-2); }
  .cust-list-row.active{ color:var(--accent-2); font-weight:600; }
  .cust-list-row-name{ flex:1; font-size:0.84rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cust-list-row-x{
    background:none; border:none; color:var(--text-dimmer);
    font-size:1rem; line-height:1; padding:2px 4px; cursor:pointer; flex-shrink:0;
  }
  .cust-list-row-x:hover{ color:var(--orange); }

  .btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:9px 14px;
    border-radius:8px;
    font-size:0.82rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{ color:var(--text); border-color:var(--accent); }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.primary:hover{ background:var(--accent-2); border-color:var(--accent-2); }
  .btn.danger:hover{ border-color:var(--orange); color:var(--orange); }

  /* progress */
  .progress-shell{
    margin-top:16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .progress-num{
    font-size:1.6rem; font-weight:700; min-width:64px;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:5px;
    background:var(--border);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius:5px;
    transition:width .35s ease;
  }
  .progress-label{ font-size:0.75rem; color:var(--text-dimmer); min-width:90px; text-align:right;}
  .progress-sub{ font-size:0.7rem; color:var(--text-dimmer); margin-top:5px; }

  .persist-banner{
    margin-top:12px;
    padding:10px 14px;
    border-radius:10px;
    font-size:0.82rem;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .persist-banner.warn{
    background:rgba(242,89,41,0.1);
    border:1px solid var(--orange);
    color:var(--orange);
  }
  .persist-banner.ok{
    background:rgba(53,196,138,0.08);
    border:1px solid var(--done);
    color:var(--done);
  }
  .persist-banner button{
    background:none;
    border:1px solid currentColor;
    color:inherit;
    border-radius:8px;
    padding:4px 10px;
    font-size:0.78rem;
    cursor:pointer;
    white-space:nowrap;
  }

  /* sections */
  .sections{ margin-top:26px; }
  .section{
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    margin-bottom:12px;
    overflow:hidden;
  }
  .section-head{
    display:flex; align-items:center; gap:14px;
    padding:15px 16px;
    cursor:pointer;
    user-select:none;
  }
  .section-num{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.8rem; font-weight:700;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    flex-shrink:0;
  }
  .section.complete .section-num{
    background:var(--done); border-color:var(--done); color:#fff;
  }
  .section-title{
    flex:1;
    font-size:0.98rem;
    font-weight:600;
  }
  .section-sub{
    font-size:0.72rem; color:var(--text-dimmer); font-weight:400; margin-top:2px;
  }
  .section-count{
    font-size:0.75rem; color:var(--text-dimmer);
    white-space:nowrap;
  }
  .chevron{
    width:9px; height:9px;
    border-right:2px solid var(--text-dimmer);
    border-bottom:2px solid var(--text-dimmer);
    transform:rotate(45deg);
    transition:transform .2s ease;
    flex-shrink:0;
    margin-right:2px;
  }
  .section.open .chevron{ transform:rotate(-135deg); }

  .section-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  /* No fixed cap: open sections grow to fit all items (a 2000px cap clipped long customer-requirement lists) */
  .section.open .section-body{ max-height:none; overflow:visible; }

  .items{ padding:2px 16px 16px; }
  .item{
    display:flex; gap:12px; align-items:flex-start;
    padding:9px 4px;
    border-top:1px solid var(--border);
  }
  .items .item:first-child{ border-top:none; }

  .item input[type=checkbox]{
    appearance:none; -webkit-appearance:none;
    width:19px; height:19px;
    border-radius:5px;
    border:1.5px solid var(--text-dimmer);
    background:transparent;
    cursor:pointer;
    flex-shrink:0;
    margin-top:2px;
    position:relative;
    transition:background .15s, border-color .15s;
  }
  .item input[type=checkbox]:checked{
    background:var(--done);
    border-color:var(--done);
  }
  .item input[type=checkbox]:checked::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:9px;
    border-right:2px solid white;
    border-bottom:2px solid white;
    transform:rotate(40deg);
  }
  .item input[type=checkbox]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .item-text{ flex:1; }
  .item-text label{
    font-size:0.88rem;
    line-height:1.45;
    cursor:pointer;
  }
  .item.done .item-text label{
    color:var(--text-dimmer);
    text-decoration:line-through;
    text-decoration-color:var(--border);
  }
  .item-link{
    display:inline-block;
    margin-top:3px;
    font-size:0.74rem;
    color:var(--accent-2);
    text-decoration:none;
    border-bottom:1px dotted currentColor;
  }
  .item-link:hover{ color:var(--accent); }

  .item.custom-item{
    border:1.5px dashed var(--orange);
    border-radius:10px;
    padding:10px 12px;
    margin:8px 0;
    background:rgba(242,89,41,0.06);
  }
  .item.custom-item:first-child{ margin-top:8px; }
  .custom-flag{
    display:inline-flex; align-items:center; gap:4px;
    font-size:0.62rem; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase;
    color:var(--orange);
    margin-bottom:4px;
  }
  .custom-flag::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background:var(--orange);
    flex-shrink:0;
  }
  .custom-meta{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin-top:5px;
  }
  .badge-feas{
    display:inline-block;
    font-size:0.63rem;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    border-radius:20px;
    padding:2px 10px;
    border:1px solid currentColor;
    background:none;
    cursor:pointer;
  }
  .badge-feas.feas-yes{ color:var(--done); }
  .badge-feas.feas-no{ color:var(--unsupported); }
  .badge-feas.feas-unknown{ color:var(--text-dimmer); }
  .note-toggle{
    background:none; border:none;
    color:var(--accent-2);
    font-size:0.7rem;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
  }
  .feas-note{
    margin-top:5px;
    font-size:0.78rem;
    color:var(--text-dim);
  }
  .feas-note-form{
    display:flex; flex-direction:column; gap:6px; margin-top:7px;
  }
  .feas-note-form textarea{
    width:100%; min-height:50px;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px 9px; font-size:0.82rem; font-family:inherit; resize:vertical;
  }
  .feas-note-form input[type=text]{ width:100%; }
  .feas-note-form-row, .item-note-form-row{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }

  .audience-toggle, .audience-toggle-edit{
    display:inline-block;
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:.02em;
    border-radius:20px;
    padding:2px 10px;
    border:1px solid currentColor;
    background:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .aud-internal{ color: var(--text-dimmer); }
  .aud-customer{ color: var(--done); }

  .item-note-block{ margin-top:8px; }
  .item-note-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .item-note-text{ margin-top:5px; font-size:0.78rem; color:var(--text-dim); }
  .item-note-form{
    display:flex; flex-direction:column; gap:6px; margin-top:7px;
  }
  .item-note-form textarea{
    width:100%; min-height:50px;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px 9px; font-size:0.82rem; font-family:inherit; resize:vertical;
  }
  /* Expected / done dates (native calendar popup) */
  .date-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .date-chip{ position:relative; display:inline-flex; align-items:center; gap:2px; }
  .date-btn{
    background:none; border:1px solid var(--border);
    color:var(--text-dimmer);
    border-radius:20px; padding:2px 10px;
    font-size:0.68rem; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  .date-btn:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .date-btn.has-value{ color:var(--text-dim); }
  .date-btn.done-date{ color:var(--done); border-color:var(--done); }
  .date-btn.overdue{ color:var(--orange); border-color:var(--orange); }
  .date-clear{
    background:none; border:none; padding:0 3px;
    color:var(--text-dimmer); font-size:0.95rem; line-height:1; cursor:pointer;
  }
  .date-clear:hover{ color:var(--orange); }
  .date-chip input[type=date]{
    position:absolute; left:0; top:100%;
    width:1px; height:1px; opacity:0; pointer-events:none;
    border:0; padding:0; color-scheme:var(--cs);
  }
  .date-chip input[type=date].visible{
    position:static; width:auto; height:auto; opacity:1; pointer-events:auto;
    margin-left:6px; padding:2px 6px;
    background:var(--panel-2); color:var(--text);
    border:1px solid var(--border); border-radius:6px; font-size:0.72rem;
  }

  /* Internal notes: private, per-item, click to add. Never exported to the PDF. */
  .int-note{ margin-top:8px; }
  .int-note-add{
    background:none; border:none; padding:0;
    color:var(--text-dimmer);
    font-size:0.7rem; cursor:pointer;
    text-decoration:underline dotted;
  }
  .int-note-add:hover{ color:var(--accent-2); }
  .int-note-view{
    border-left:3px solid var(--accent-2);
    background:var(--panel-2);
    border-radius:0 8px 8px 0;
    padding:6px 10px;
    cursor:pointer;
  }
  .int-note-view:hover{ filter:brightness(1.08); }
  .int-note-label{
    font-size:0.62rem; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-dimmer);
  }
  .int-note-text{
    margin-top:2px;
    font-size:0.8rem; line-height:1.45;
    color:var(--text);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .int-note-form{ display:flex; flex-direction:column; gap:6px; }
  .int-note-form textarea{
    width:100%; min-height:60px;
    background:var(--panel-2); border:1px solid var(--accent-2); color:var(--text);
    border-radius:8px; padding:7px 9px; font-size:0.82rem; font-family:inherit; resize:vertical;
  }
  .int-note-form-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .item-remove{
    background:none; border:none;
    color:var(--text-dimmer);
    font-size:1.1rem; line-height:1;
    cursor:pointer;
    padding:0 2px 0 8px;
    flex-shrink:0;
    align-self:flex-start;
  }
  .item-remove:hover{ color:var(--orange); }

  .item-actions{
    display:flex; gap:4px; align-self:flex-start; flex-shrink:0;
  }
  .item-edit-btn, .item-hide-btn{
    background:none; border:1px solid var(--border);
    color:var(--text-dimmer);
    border-radius:6px;
    width:24px; height:24px;
    font-size:0.8rem;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .item-edit-btn:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .item-hide-btn:hover{ border-color:var(--orange); color:var(--orange); }
  .item-edit-form{
    display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;
  }
  .item-edit-form input[type=text]{ flex:1; min-width:180px; }

  .item.item-hidden{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:7px 4px;
    border-top:1px solid var(--border);
    opacity:0.6;
  }
  .items .item.item-hidden:first-child{ border-top:none; }
  .hidden-label{
    font-size:0.82rem;
    color:var(--text-dimmer);
    text-decoration:line-through;
    text-decoration-color:var(--border);
  }
  .restore-btn{
    background:none; border:1px solid var(--border);
    color:var(--accent-2);
    border-radius:7px;
    padding:3px 10px;
    font-size:0.74rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .restore-btn:hover{ border-color:var(--accent-2); }

  .hide-section-btn{
    background:none; border:1px solid var(--border);
    color:var(--text-dimmer);
    border-radius:6px;
    width:26px; height:26px;
    font-size:0.85rem;
    cursor:pointer;
    flex-shrink:0;
  }
  .hide-section-btn:hover{ border-color:var(--orange); color:var(--orange); }

  .section.section-hidden{ opacity:0.65; }
  .section.section-hidden .section-head{ cursor:default; }
  .hidden-tag{
    font-size:0.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--orange);
    margin-left:6px;
  }
  .restore-section-btn{
    flex-shrink:0;
    background:none; border:1px solid var(--orange);
    color:var(--orange);
    border-radius:7px;
    padding:4px 12px;
    font-size:0.78rem;
    cursor:pointer;
  }

  .add-req{ padding:8px 4px 2px; }
  .add-req-btn{
    background:none;
    border:1px dashed var(--border);
    color:var(--text-dimmer);
    border-radius:8px;
    padding:7px 12px;
    font-size:0.78rem;
    cursor:pointer;
    width:100%;
    text-align:left;
  }
  .add-req-btn:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .add-req-form{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .add-req-form input[type=text]{ flex:1; min-width:160px; }

  .section-note{
    margin:8px 4px 4px;
  }
  .section-note textarea{
    width:100%;
    min-height:52px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:0.82rem;
    font-family:inherit;
    resize:vertical;
  }
  .section-note label.tiny{ margin-bottom:5px; }

  footer.bottom{
    margin-top:28px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .toast{
    position:fixed;
    bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--accent);
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:0.82rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:520px){
    .titlebar h1{ font-size:1.1rem; }
    .progress-num{ font-size:1.3rem; }
    .section-title{ font-size:0.9rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="titlebar">
      <h1>Checkmarx <span>One</span> — Onboarding Checklist</h1>
      <button class="theme-toggle" id="themeToggle" type="button">Toggle theme</button>
    </div>

    <div class="subrow">
      <div class="field">
        <label class="tiny" for="custName">Customer</label>
        <input type="text" id="custName" placeholder="e.g. Thundercrest Fizzwidget Corp" autocomplete="off">
      </div>
      <div class="field" style="flex:0 1 220px; min-width:170px; position:relative;">
        <label class="tiny" for="custListToggle">Saved checklists</label>
        <button type="button" class="btn" id="custListToggle" style="width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center;">
